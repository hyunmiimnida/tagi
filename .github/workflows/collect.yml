# 하루 1회 정보를 자동으로 수집해서 data/programs.json을 갱신한다
name: 정보 수집

on:
  schedule:
    - cron: "0 21 * * *" # 매일 한국 시간 오전 6시 (UTC 21시)
  workflow_dispatch: # GitHub 화면에서 직접 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collect
      # 일부 출처가 실패해도 성공한 출처의 결과는 저장한다
      - name: 수집 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "정보 수집 결과 갱신"
          git push
