# 하루 1회 정보를 자동으로 수집해서 data/programs.json을 갱신한다
name: 정보 수집

on:
  schedule:
    - cron: "0 21 * * *" # 매일 한국 시간 오전 6시 (UTC 21시)
  workflow_dispatch: # GitHub 화면에서 직접 실행 버튼

permissions:
  contents: write

# 수집이 겹쳐 돌지 않게 한 번에 하나만 실행한다
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collect
      # 일부 출처가 실패해도 성공한 출처의 결과는 저장한다
      - name: 수집 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 그사이 내 컴퓨터 수집 결과가 먼저 올라오면 올리기가 실패한다.
          # 그때는 이번 결과를 버리고 최신을 받아 수집을 다시 한다 (최대 3번)
          for try in 1 2 3; do
            git add data
            git diff --cached --quiet || git commit -m "정보 수집 결과 갱신"
            git push && exit 0
            echo "올리기 실패 ($try번째): 최신을 받아 다시 수집"
            git fetch origin main
            git reset --hard origin/main # 수집 서버라 다른 작업이 없어 통째로 맞춰도 된다
            npm run collect || true
          done
          exit 1
