# 매일 아침 알림 보내기: 내일 마감인 관심 공고(웹 푸시)와 새 신고(GitHub 이슈 → 운영자 메일)
name: 알림 보내기

on:
  schedule:
    - cron: "0 0 * * *" # 매일 한국 시간 오전 9시 (UTC 0시)
  workflow_dispatch: # GitHub 화면에서 직접 실행 버튼

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://rytvncrksqcrxhsojmpj.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 마감 알림
        run: node scripts/notify.ts deadline
      # 새 신고가 있으면 "신고 확인" 이슈를 만든다 (이미 열려 있으면 댓글). GitHub이 저장소 주인에게 메일로 알려 준다
      - name: 신고 알림
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/notify.ts reports reports.md
          if [ -s reports.md ]; then
            gh label create "신고" --color fbca04 --force >/dev/null 2>&1 || true
            num=$(gh issue list --state open --label "신고" --json number --jq ".[0].number")
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file reports.md
            else
              gh issue create --title "신고 확인 필요" --label "신고" --body-file reports.md
            fi
            node scripts/notify.ts mark-reported
          fi
