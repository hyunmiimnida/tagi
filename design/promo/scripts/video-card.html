<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>캠퍼스모아</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { background: #f2f4f6; color: #191f28; font-family: "Pretendard Variable", "Malgun Gothic", sans-serif; word-break: keep-all; }
    header { position: absolute; top: 80px; left: 88px; right: 88px; height: 44px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; }
    .brand img { width: 44px; height: 44px; border-radius: 11px; }
    .site { color: #636c78; font-size: 24px; }
    h1 { position: absolute; top: 190px; left: 88px; right: 88px; margin: 0; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; }
    em { color: #1c68e3; font-style: normal; }
    .bezel { position: absolute; left: 216px; top: 428px; width: 648px; height: 1374px; border-radius: 56px; background: white; box-shadow: 0 0 0 1px #e5e8eb, 0 20px 48px rgba(25,31,40,0.10); }
    .mask { position: absolute; left: 228px; top: 440px; width: 624px; height: 1350px; background: white; border-radius: 44px; }
    .end { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .end img { width: 120px; height: 120px; border-radius: 28px; }
    .end h2 { margin: 28px 0 0; font-size: 72px; font-weight: 800; line-height: 1.25; }
    .end p { margin: 0; line-height: 1.4; }
    .end .tagline { margin-top: 40px; font-size: 44px; font-weight: 700; }
    .end .url { margin-top: 28px; color: #1c68e3; font-size: 40px; font-weight: 700; }
    .end .hint { margin-top: 20px; color: #4e5968; font-size: 32px; font-weight: 500; }
    body > * { display: none; }
    body[data-mode="background"] header { display: flex; }
    body[data-mode="background"] .bezel, body[data-mode="caption"] h1, body[data-mode="mask"] .mask { display: block; }
    body[data-mode="caption"] { background: transparent; }
    body[data-mode="mask"] { background: black; }
    body[data-mode="end"] .end { display: flex; }
  </style>
</head>
<body data-mode="background">
  <header><div class="brand"><img alt=""><span>캠퍼스모아</span></div><span class="site">tagi-ten.vercel.app</span></header>
  <h1></h1>
  <div class="bezel"></div>
  <div class="mask"></div>
  <section class="end">
    <img alt="">
    <h2>캠퍼스모아</h2>
    <p class="tagline">흩어진 학교 공고, <em>한곳에서</em></p>
    <p class="url">tagi-ten.vercel.app</p>
    <p class="hint">사이트에 들어가 홈 화면에 추가하세요</p>
  </section>
  <script>
    // 글꼴과 아이콘이 준비되면 저장해요.
    window.renderCard = async ({ mode, caption = '', icon }) => {
      document.body.dataset.mode = mode;
      document.querySelector('h1').innerHTML = caption;
      document.querySelectorAll('img').forEach((img) => { img.src = icon; });
      await document.fonts.ready;
      await Promise.all([...document.images].map((img) => img.decode()));
    };
  </script>
</body>
</html>
