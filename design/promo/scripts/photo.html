<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>캠퍼스모아</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1350px; overflow: hidden; }
    body { background: #f2f4f6; color: #191f28; font-family: "Pretendard Variable", "Malgun Gothic", sans-serif; word-break: keep-all; }
    header { position: absolute; top: 72px; left: 88px; right: 88px; height: 44px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; }
    .brand img { width: 44px; height: 44px; border-radius: 11px; }
    .site { font-size: 24px; color: #636c78; }
    .copy { position: absolute; top: 170px; left: 88px; right: 88px; }
    h1 { margin: 0; font-size: 64px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; }
    em { color: #1c68e3; font-style: normal; }
    .subtitle { margin: 16px 0 0; font-size: 32px; font-weight: 500; line-height: 1.25; color: #4e5968; white-space: nowrap; }
    .phone { position: absolute; top: 430px; left: 220px; width: 640px; height: 1400px; border: 12px solid #ffffff; border-bottom: 0; border-radius: 52px 52px 0 0; box-shadow: 0 0 0 1px #e5e8eb, 0 20px 48px rgba(25,31,40,0.10); background: #ffffff; overflow: hidden; }
    .phone > div { width: 100%; height: 100%; border-radius: 40px 40px 0 0; overflow: hidden; }
    .shot { width: 100%; height: auto; display: block; }
    .notification { position: absolute; top: 470px; left: 160px; width: 760px; padding: 28px 32px; background: #ffffff; border: 1px solid #e5e8eb; border-radius: 28px; box-shadow: 0 12px 32px rgba(25,31,40,0.12); }
    .notification[hidden] { display: none; }
    .notification-header { display: flex; align-items: center; gap: 12px; font-size: 24px; color: #4e5968; }
    .notification-header img { width: 40px; height: 40px; border-radius: 10px; }
    .notification-header time { margin-left: auto; color: #636c78; }
    .notification-title { margin: 20px 0 8px; font-size: 30px; font-weight: 700; line-height: 1.3; }
    .notification-body { margin: 0; font-size: 28px; line-height: 1.4; color: #4e5968; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img class="app-icon" alt=""><span>캠퍼스모아</span></div>
    <span class="site">tagi-ten.vercel.app</span>
  </header>
  <section class="copy">
    <h1></h1>
    <p class="subtitle"></p>
  </section>
  <div class="phone"><div><img class="shot" alt="캠퍼스모아 앱 화면"></div></div>
  <aside class="notification" hidden>
    <div class="notification-header"><img class="app-icon" alt=""><span>캠퍼스모아</span><time>지금</time></div>
    <p class="notification-title"></p>
    <p class="notification-body"></p>
  </aside>
  <script>
    // 렌더러에서 전달한 슬라이드 내용을 화면에 채워요.
    window.renderSlide = async (data) => {
      document.querySelector('h1').innerHTML = data.title;
      document.querySelector('.subtitle').textContent = data.sub;
      document.querySelectorAll('.app-icon').forEach((img) => { img.src = data.icon; });
      const shot = document.querySelector('.shot');
      shot.src = data.shot;
      document.querySelector('.notification').hidden = !data.notification;
      document.querySelector('.notification-title').textContent = data.notification?.title ?? '';
      document.querySelector('.notification-body').textContent = data.notification?.body ?? '';
      // 글꼴과 이미지가 준비된 다음 제목 높이에 맞춰 사진을 배치해요.
      await document.fonts.ready;
      await Promise.all([...document.images].map((img) => img.decode()));
      // offset: 캡처 위쪽을 얼마나 건너뛸지(휴대폰 화면 CSS px). 잘린 부분 없이 보여 주고 싶은 곳이 아래에 있을 때
      shot.style.marginTop = `${-(data.offset ?? 0) * (616 / 390)}px`;
      document.querySelector('.phone').style.top = `${Math.max(430, document.querySelector('.copy').getBoundingClientRect().bottom + 56)}px`;
    };
  </script>
</body>
</html>
