<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>캠퍼스모아 소개 영상</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    * { box-sizing: border-box; word-break: keep-all; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
    body { background: #f2f4f6; color: #191f28; font-family: "Pretendard Variable", "Malgun Gothic", sans-serif; }
    h1, h2, p { margin: 0; }
    #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    #hook { position: absolute; left: 80px; top: 900px; width: 920px; translate: 0 -50%; }
    .hook-title { font-size: 100px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; }
    .hook-line { display: block; white-space: nowrap; }
    .accent { color: #1c68e3; }
    .pills { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 60px; }
    .pill { padding: 18px 32px; border: 1px solid #e5e8eb; border-radius: 999px; background: #fff; color: #4e5968; font-size: 44px; font-weight: 600; line-height: 1.3; white-space: nowrap; opacity: 0; }
    .caption { position: absolute; left: 80px; top: 150px; width: 920px; display: flex; align-items: center; gap: 24px; opacity: 0; }
    .step { display: flex; align-items: center; justify-content: center; flex: 0 0 64px; width: 64px; height: 64px; border-radius: 50%; background: #1c68e3; color: #fff; font-size: 34px; font-weight: 800; line-height: 1; }
    .caption-text { flex: 0 0 auto; font-size: 66px; font-weight: 800; line-height: 1.2; letter-spacing: -0.03em; white-space: nowrap; }
    .screen-card { position: absolute; left: 90px; top: 420px; width: 900px; height: 1385px; overflow: hidden; border-radius: 44px; background: #fff; box-shadow: 0 20px 48px rgba(25,31,40,0.10); opacity: 0; }
    .screen-card::after { content: ""; position: absolute; inset: 0; border: 1px solid #e5e8eb; border-radius: inherit; pointer-events: none; }
    .screen-image { position: absolute; left: 0; top: 0; display: block; width: 900px; height: auto; max-width: none; opacity: 0; }
    .tap { position: absolute; z-index: 1; width: 40px; height: 40px; border-radius: 50%; border: 4px solid rgba(28,104,227,0.70); background: rgba(28,104,227,0.22); transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
    #notification { position: absolute; z-index: 2; left: 70px; top: 380px; width: 940px; padding: 32px 36px; border: 1px solid #e5e8eb; border-radius: 32px; background: #fff; box-shadow: 0 20px 48px rgba(25,31,40,0.16); opacity: 0; }
    .notification-row { display: flex; align-items: center; gap: 14px; color: #4e5968; font-size: 28px; line-height: 1.3; }
    .notification-icon { display: block; width: 44px; height: 44px; border-radius: 11px; }
    .notification-time { margin-left: auto; color: #8b95a1; }
    .notification-title { margin-top: 16px; font-size: 36px; font-weight: 700; line-height: 1.3; white-space: nowrap; }
    .notification-body { margin-top: 8px; color: #4e5968; font-size: 32px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #ending { position: absolute; left: 0; top: 900px; width: 1080px; display: flex; flex-direction: column; align-items: center; transform: translateY(-50%); }
    .end-item { flex: none; opacity: 0; }
    .end-icon { display: block; width: 216px; height: 216px; border-radius: 48px; }
    .end-name { margin-top: 36px; font-size: 88px; font-weight: 800; line-height: 1.2; }
    .end-tagline { margin-top: 20px; font-size: 44px; font-weight: 600; line-height: 1.3; color: #4e5968; }
    .end-link { margin-top: 64px; padding: 40px 60px; border: 1px solid #e5e8eb; border-radius: 36px; background: #fff; box-shadow: 0 20px 48px rgba(25,31,40,0.10); color: #1c68e3; font-size: 66px; font-weight: 800; line-height: 1.2; white-space: nowrap; }
    .end-hint { margin-top: 32px; font-size: 40px; font-weight: 600; line-height: 1.3; color: #8b95a1; }
  </style>
</head>
<body>
  <main id="stage">
    <section id="hook">
      <h1 class="hook-title"><span class="hook-line">장학금 공고 찾느라</span><span class="hook-line">사이트 <span class="accent">몇 개</span> 여세요?</span></h1>
      <div class="pills"><span class="pill">학교 공지</span><span class="pill">취업센터</span><span class="pill">창업지원단</span><span class="pill">학과 게시판</span></div>
    </section>
    <div id="scenes"></div>
    <aside id="notification">
      <div class="notification-row"><img class="notification-icon app-icon" alt=""><span>캠퍼스모아</span><span class="notification-time">지금</span></div>
      <p class="notification-title">내일 마감되는 관심 공고가 있어요</p>
      <p class="notification-body">2027년도 STX장학재단 장학생 선발 안내</p>
    </aside>
    <section id="ending">
      <img class="end-item end-icon app-icon" alt="">
      <h2 class="end-item end-name">캠퍼스모아</h2>
      <p class="end-item end-tagline">흩어진 학교 공고, 한곳에서</p>
      <div class="end-item end-link">tagi-ten.vercel.app</div>
      <p class="end-item end-hint">앱 설치 없이 홈 화면에 추가</p>
    </section>
  </main>
  <script>
    const SCALE = 900 / 390;
    const TIMELINE = [
      { start: 2.4, end: 6.6, caption: '우리 학교를 고르고', steps: [['v01-list-all', 3.5], ['v02-school-panel', 5.0], ['v03-school-list', 6.6]] },
      { start: 6.6, end: 11.2, caption: '관심 분야를 고르면', steps: [['v03-school-list', 7.6], ['v04-tag-panel', 9.0], ['v05-tag-picked', 9.9], ['v06-tag-list', 11.2]] },
      { start: 11.2, end: 14.8, caption: '핵심만 보고 관심 표시', steps: [['v07-detail', 12.8], ['v08-detail-starred', 14.8]] },
      { start: 14.8, end: 17.6, caption: '마감 전날엔 알림까지', steps: [['v09-calendar', 17.6]] },
    ];
    const clamp = value => Math.max(0, Math.min(1, value));
    const progress = (t, start, duration) => clamp((t - start) / duration);
    const easeOutCubic = value => 1 - (1 - clamp(value)) ** 3;
    const get = id => document.getElementById(id);
    const pills = [...document.querySelectorAll('.pill')];
    const endItems = [...document.querySelectorAll('.end-item')];
    let scenes = [];

    function pose(element, opacity, y) {
      element.style.opacity = String(clamp(opacity));
      element.style.transform = `translateY(${y}px)`;
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    // 원본 좌표를 유지하고 각 장면의 화면을 같은 카드 안에 겹친다.
    window.setup = function setup(data) {
      if (data.viewport.width !== 390 || data.viewport.height !== 844 || data.viewport.scale !== 3) {
        throw new Error('입력 화면은 390×844, 배율 3이어야 합니다.');
      }
      const states = new Map(data.states.map(state => [state.name, state]));
      const star = states.get('v07-detail')?.tap;
      if (!star) throw new Error('관심 표시 버튼 좌표가 없습니다.');
      const starOrigin = `${(star.x + star.width / 2) * SCALE}px ${(star.y + star.height / 2) * SCALE}px`;
      document.querySelectorAll('.app-icon').forEach(icon => { icon.src = data.iconUrl; });
      get('scenes').replaceChildren();
      scenes = TIMELINE.map((definition, index) => {
        const caption = makeElement('header', 'caption');
        caption.append(makeElement('span', 'step', String(index + 1)), makeElement('h2', 'caption-text', definition.caption));
        const card = makeElement('div', 'screen-card');
        const layers = definition.steps.map(([name, until], i) => {
          const state = states.get(name);
          if (!state?.url) throw new Error(`화면 파일이 없습니다: ${name}`);
          const image = makeElement('img', 'screen-image');
          image.alt = '';
          image.src = state.url;
          image.style.height = `${data.viewport.height * SCALE}px`;
          image.style.transformOrigin = starOrigin;
          card.append(image);
          return { ...state, image, until, start: i ? definition.steps[i - 1][1] : definition.start };
        });
        const tap = makeElement('div', 'tap');
        card.append(tap);
        get('scenes').append(card, caption);
        return { ...definition, card, caption, layers, tap };
      });
      window.renderAt(0);
    };

    function renderHook(t) {
      const exit = progress(t, 1.9, 0.5);
      pose(get('hook'), 1 - exit, -40 * easeOutCubic(exit));
      pills.forEach((pill, i) => {
        const enter = easeOutCubic(progress(t, 0.3 + i * 0.3, 0.3));
        pose(pill, enter, 20 * (1 - enter));
      });
    }

    function renderLayers(scene, t) {
      scene.layers.forEach((layer, i) => {
        // 이전 화면을 불투명하게 받쳐 교차 전환 중 흰색 비침을 막는다.
        let opacity = i ? progress(t, layer.start, 0.2) : 1;
        if (i < scene.layers.length - 1 && t >= layer.until + 0.2) opacity = 0;
        layer.image.style.opacity = String(opacity);
        const zoom = layer.name === 'v08-detail-starred' ? 1 + 0.04 * easeOutCubic(progress(t, 12.8, 2)) : 1;
        layer.image.style.transform = `scale(${zoom})`;
      });
    }

    function renderTap(scene, t) {
      // 마지막 상태는 다음 장면과 같을 수 있으므로 실제 상태 전환만 표시한다.
      const layer = scene.layers.slice(0, -1).find(item => item.tap && t >= item.until - 0.45 && t < item.until);
      const marker = scene.tap;
      const diameter = layer ? 40 + 56 * easeOutCubic(progress(t, layer.until - 0.45, 0.3)) : 40;
      marker.style.left = `${layer ? (layer.tap.x + layer.tap.width / 2) * SCALE : 0}px`;
      marker.style.top = `${layer ? (layer.tap.y + layer.tap.height / 2) * SCALE : 0}px`;
      marker.style.width = `${diameter}px`;
      marker.style.height = `${diameter}px`;
      marker.style.opacity = String(layer ? 1 - progress(t, layer.until - 0.15, 0.15) : 0);
    }

    function renderScene(scene, t) {
      const enter = easeOutCubic(progress(t, scene.start, 0.3));
      const exit = easeOutCubic(progress(t, scene.end, 0.3));
      pose(scene.card, enter * (1 - exit), 60 * (1 - enter) - 60 * exit);
      const captionIn = easeOutCubic(progress(t, scene.start, 0.25));
      const captionOut = easeOutCubic(progress(t, scene.end, 0.25));
      pose(scene.caption, captionIn * (1 - captionOut), 20 * (1 - captionIn) - 20 * captionOut);
      renderLayers(scene, t);
      renderTap(scene, t);
    }

    function renderNotification(t) {
      const enter = easeOutCubic(progress(t, 15.4, 0.35));
      const exit = easeOutCubic(progress(t, 17.6, 0.3));
      pose(get('notification'), enter * (1 - exit), -80 * (1 - enter) - 60 * exit);
    }

    function renderEnding(t) {
      endItems.forEach((element, i) => {
        const enter = easeOutCubic(progress(t, 17.7 + i * 0.12, 0.3));
        pose(element, enter, 24 * (1 - enter));
      });
    }

    // 매번 모든 가변 값을 시간만으로 다시 계산한다.
    window.renderAt = function renderAt(t) {
      if (!Number.isFinite(t)) throw new Error('시간은 유한한 초 단위 숫자여야 합니다.');
      t = Math.max(0, Math.min(20, t));
      renderHook(t);
      scenes.forEach(scene => renderScene(scene, t));
      renderNotification(t);
      renderEnding(t);
    };
    window.renderAt(0);
  </script>
</body>
</html>
